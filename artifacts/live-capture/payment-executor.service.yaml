apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: "uptime402-payment-executor"
  labels:
    cloud.googleapis.com/location: "asia-northeast3"
  annotations:
    # Network-reachable so the unauthenticated 401/403 boundary can be probed;
    # access remains private because allUsers is never granted run.invoker.
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/secrets: "executor-signer:projects/uptime402-hack-260803/secrets/uptime402-executor-signer"
    spec:
      serviceAccountName: "uptime402-executor@uptime402-hack-260803.iam.gserviceaccount.com"
      containerConcurrency: 8
      timeoutSeconds: 300
      containers:
        - image: "asia-northeast3-docker.pkg.dev/uptime402-hack-260803/uptime402/payment-executor:c938a866b74c9f2682b0d1c1fe27391e562b7caa"
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: NODE_ENV
              value: production
            - name: FIRESTORE_PROJECT_ID
              value: "uptime402-hack-260803"
            - name: FIRESTORE_DATABASE_ID
              value: "(default)"
            - name: FIRESTORE_COLLECTION_PREFIX
              value: "uptime402"
            - name: EXECUTOR_EXPECTED_AUDIENCE
              value: "https://uptime402-payment-executor-1065649463621.asia-northeast3.run.app"
            - name: CONTROL_PLANE_SERVICE_ACCOUNT
              value: "uptime402-control@uptime402-hack-260803.iam.gserviceaccount.com"
            - name: OPERATOR_PRINCIPAL
              value: "uptime402-control@uptime402-hack-260803.iam.gserviceaccount.com"
            - name: MANDATE_ISSUER_PRINCIPAL
              value: "operator:khyun2348@gmail.com"
            - name: MANDATE_SIGNER_PUBLIC_KEY
              value: "7CqTyiu94soP6BUhUx2Gd7AsTaocy1J18pu5KdSFd7aY"
            - name: MANDATE_SIGNER_KEY_ID
              value: "uptime402-mandate-v1"
            - name: VENDOR_OFFER_SIGNER_PUBLIC_KEY
              value: "F2H34mSSfeDQ7eerYeUa3cKk5YBdWnmDahTqLf3rKaP1"
            - name: VENDOR_OFFER_SIGNER_KEY_ID
              value: "uptime402-vendor-v1"
            - name: EXECUTOR_WALLET_KEYPAIR_PATH
              value: /var/run/secrets/uptime402/executor-signer/keypair.json
            - name: EXECUTOR_WALLET_SECRET_ROOT
              value: /var/run/secrets/uptime402/executor-signer
            - name: EXECUTOR_WALLET_PUBLIC_KEY
              value: "5ZT11fqnqaZPbWLqx5o4PCNSisXLKV1YFtNUxjQSGPHu"
            - name: SOLANA_RPC_URL
              value: "https://api.devnet.solana.com"
            - name: X402_FACILITATOR_URL
              value: "https://x402.org/facilitator"
            - name: ALLOWED_VENDOR_ORIGINS
              value: "https://uptime402-vendor-agent-1065649463621.asia-northeast3.run.app"
            - name: ESTIMATED_NETWORK_FEE_LAMPORTS
              value: "100000"
            - name: SOLANA_CLUSTER_LABEL
              value: devnet
            - name: SOLANA_GENESIS_HASH
              value: EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG
            - name: X402_NETWORK_ID
              value: solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1
            - name: X402_SDK_NETWORK_ID
              value: solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1
            - name: USDC_MINT
              value: 4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU
            - name: USDC_DECIMALS
              value: "6"
          volumeMounts:
            - name: executor-signer
              mountPath: /var/run/secrets/uptime402/executor-signer
              readOnly: true
      volumes:
        - name: executor-signer
          secret:
            secretName: executor-signer
            defaultMode: 292
            items:
              - key: "1"
                path: keypair.json
